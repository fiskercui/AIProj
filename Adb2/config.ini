# Android FPS 监控工具配置文件
# 
# 使用说明：
# 1. 如果 ADB 已添加到系统 PATH，可以保持 adb_path 为 "adb"
# 2. 如果需要指定完整路径，请修改 adb_path 为实际路径
#    例如：C:/Users/YourName/AppData/Local/Android/Sdk/platform-tools/adb.exe
# 3. 可以修改默认监控参数

[adb]
# ADB 命令路径（可以是命令名或完整路径）
# 注意：路径中如果包含空格，可以使用引号或双反斜杠
# Windows 示例1：C:/Users/YourName/AppData/Local/Android/Sdk/platform-tools/adb.exe
# Windows 示例2：F:/Program Files/Netease/MuMu/nx_main/adb.exe
# Windows 示例3（包含空格）："F:/Program Files/Netease/MuMu/nx_main/adb.exe"
# Linux/Mac 示例：/home/username/Android/Sdk/platform-tools/adb
# 如果已加入 PATH，直接使用：adb
adb_path = "F:/Program Files/Netease/MuMu/nx_main/adb.exe"
# ADB 命令超时时间（秒）
command_timeout = 5

[monitor]
# 默认应用包名（留空则必须通过命令行指定）
# 可以在此设置常用的应用包名，简化命令行操作
# 示例：com.tencent.mm, com.android.chrome, com.tencent.tmgp.sgame
default_package =com.cultivation.zmda.q1

# 默认监控持续时间（秒）
default_duration = 60

# 默认采样间隔（秒）
default_interval = 1.0

# 数据采集方法（优先级顺序）
# 可选值：gfxinfo, surfaceflinger
primary_method = gfxinfo
fallback_method = surfaceflinger

[chart]
# 图表尺寸（英寸）
figure_width = 12
figure_height = 8

# 图表 DPI（分辨率）
dpi = 300

# 60 FPS 基准线颜色
fps_60_color = green

# 30 FPS 基准线颜色
fps_30_color = orange

# 中文字体（Windows）
# 可选：SimHei, Microsoft YaHei, KaiTi, FangSong
font_family = Microsoft YaHei

[output]
# 默认输出目录（留空则使用当前目录）
output_directory = 

# 输出文件名模板
# 可用变量：{package}, {timestamp}, {duration}
chart_filename_template = fps_chart_{package}_{timestamp}.png
csv_filename_template = fps_data_{package}_{timestamp}.csv

# 时间戳格式
timestamp_format = %Y%m%d_%H%M%S

[filter]
# 帧时间过滤范围（毫秒）
# 用于过滤异常值
min_frame_time = 1
max_frame_time = 100

# 是否自动过滤 FPS 为 0 的数据点
filter_zero_fps = true
